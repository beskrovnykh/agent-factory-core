# Своя проверка продукта, независимая от инсталляций.
#
# До 09.09.2026 тесты ядра гонялись ТОЛЬКО внутри пайплайна первого клиента
# (джоба test:agent-runner в его infrastructure). Проверить фабрику, не трогая
# чужую инфраструктуру, было нельзя — это и есть та зависимость, из-за которой
# продукт не мог развиваться отдельно (DEV-10).
name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Одна версия, потому что стек несёт свой интерпретатор: установщик
      # ставит 3.12 standalone-сборкой и делает venv, а системный питон хоста
      # не используется вовсе. Матрица 3.10+3.12 здесь была ровно до тех пор,
      # пока стек зависел от того, что стоит на чужом сервере (09.09.2026).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: зависимости
        run: pip install -r requirements-dev.txt

      # Тесты лежат рядом с кодом и импортируют его без пакета (import runner),
      # поэтому запускаются из core/, а не из корня.
      - name: тесты
        working-directory: core
        run: python -m pytest -q

      # Сессия запускается как отдельный процесс на хосте, где нет ни pytest,
      # ни dev-зависимостей. Синтаксическая ошибка в модуле, который тесты не
      # импортируют, доедет до прода молча — поэтому компилируем всё.
      - name: компиляция всех модулей
        working-directory: core
        run: python -m compileall -q .

      # Ворота на наборы скилов (DEV-13). Проверяется РАЗБОР, а не поведение:
      # модели в пайплайне нет и денег на неё тоже, поэтому здесь ловится
      # скил без набора, битое выражение оценщика, оценщик неизвестного вида и
      # набор без близких промахов (по одним положительным запросам доля
      # срабатывания всегда единица, то есть не проверяет ничего).
      #
      # Чего эти ворота НЕ значат: что скил работает. Вклад и доля
      # срабатывания меряются прогоном с моделью
      # (`python3 core/skilleval.py run`) и кладутся в отчёт руками. Зелёная
      # джоба при бесполезном скиле — ожидаемое поведение, а не дыра.
      - name: наборы кейсов скилов разбираются
        run: python3 core/skilleval.py lint
